name: tkos-memory

x-memory-environment: &memory-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
  MEMORY_TENANT: ${MEMORY_TENANT}
  MEMORY_ORG: ${MEMORY_ORG}
  VIEWER_USER_ID: ${VIEWER_USER_ID}
  MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
  MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
  MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
  MEMORY_EMBEDDING_DIM: ${MEMORY_EMBEDDING_DIM:-2048}
  ADAPTER_AUTH: ${ADAPTER_AUTH:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [memory-internal]

  migrate:
    image: tkos-memory-service:${SERVICE_IMAGE_TAG:-171b857}
    command: ["tkos-memory-migrate"]
    environment: *memory-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    networks: [memory-internal]

  memory-service:
    image: tkos-memory-service:${SERVICE_IMAGE_TAG:-171b857}
    environment: *memory-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MEMORY_SERVICE_PORT:-8010}:8010"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    networks: [memory-internal, service-egress]

networks:
  memory-internal:
    internal: true
  service-egress:


volumes:
  postgres-data:
