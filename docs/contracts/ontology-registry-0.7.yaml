# TKOS 本体登记（草案）v0.7
# 把《TKOS 本体结构 v0.7（M1 范围）｜CEO 对齐稿 2026-09-22》写成机器可读：一级对象、关系、人工门、不进矩阵的项、待定问题。
# 0.7.1：为 tkos.method/0.5 补 runtime_0_5（交付后的目标状态），JSON 导出后钉进 method-profile-0.5.json 的 ontology_registry_ref。
# 用途：① 文档的 A1 / A2 / 表 B 以后从这里生成；② 测试断言它与运行时模型、数据库 CHECK 约束一致；
#       ③ 0.5 契约的关系投影表按这里的 relations 派生。它不改变任何运行时语义。
# 冻结方式：status 改为 frozen，算 tkos-json-v1 规范化后的 SHA-256，钉进 gov_method_profile_revisions.content.ontology_ref。
registry_id: tkos.ontology-registry
revision: "0.7.1"
status: draft
checked_date: "2026-09-22"
based_on:
  section: 《TKOS 本体结构 v0.7（M1 范围）｜CEO 对齐稿 2026-09-22》，docx KuU8d7rq6oozKDxtZqkcHI0nnJa，revision 3；前一版第八节 v0.6 留在评审汇总 docx NpMCdkhOKoYIsPxOXfUcqnOQnPf（revision 190），会上评论附在那里
  inventory: TKOS Method Artifact Master Inventory v0.8（田田确认即 v0.8.1），wiki bitable V3sTbyCzPaKhIUs8GOacVcXSnec，六页签
  methods: [M1-A v3.1, M1-B v5.1, M2 v3.1, M3 v1.2, MF v1.1]
  discussion_draft: 《TKOS 本体业务语义与数据对象讨论稿》v0.3，docx V9QTdbEAuokgohxSJSvcGwGPn6b，revision 9
  meeting: 9/22 14:00 内部对齐会（斯一、田田、人豪），妙记 obcn629472ww9266s9qy47l4；会上评审汇总文档的评论 7688238641633561572（田田，PCO 补 Expected LT Progress Advance）与 7688240234856827849 / 7688241714342988728 / 7688242121442069468 / 7688242588582824910（斯一）
  product_spec: 《M1B L5 需求文档》3.1 到 3.13，只取字段形状；田田 9/22 会上说产品 L5 目前没有，不作为对齐对象
  runtime_contract: tkos.method/0.4（对照用，登记不改它）
conventions:
  ids: 对象与关系的 id 用英文，说明用中文；doc_name / doc 三元组与 CEO 对齐稿 A2 / 表 B / 附 1 原文逐字一致，供文档一致性检查。
  m1_scope: this_period 本期落地 | reference_only 本期只读入 | optional 可选 | later 本期不做（标所属方法）
  runtime_status: exists 已有 | partial 部分（字段或语义有差） | missing 没有 | product_mechanism 产品或运行机制，不是经营对象
  runtime_0_5: tkos.method/0.5 交付后的目标状态；tests/test_ontology_registry.py 核对其 fields 都在 method_v05_models.PAYLOAD_MODELS 上
  pinned_ref: 引用是否钉到确切版本（object_id + revision_id + payload_hash）；Operating State 的引用改为主体加起止时间
  doc_columns: 文档 A2 只列 大白话 / 属性 / 边界 / 谁确认 / 更新节奏 / 本期；总表页签（inventory_tab）与默认承载（carrier_default）按 9/22 会议不进文档，只留在登记里

axes:
  responsibility_scopes:
    - {id: company_strategy, label: 公司 / 战略}
    - {id: battlefield_domain, label: 责任域（战场 / 域）}
    - {id: mission, label: Mission}
    - {id: cross_cutting, label: 跨层}
  business_semantics:
    - {id: structure_responsibility, label: 经营结构与责任, question: 谁在什么责任空间里经营}
    - {id: intent_commitment, label: 意图与承诺, question: 我们选择什么、必须实现什么}
    - {id: conditions_constraints, label: 经营条件与约束, question: 在什么限制下选择与承诺}
    - {id: realization_design, label: 实现设计, question: 准备怎么做成}
    - {id: reality_results, label: 经营现实与结果, question: 实际怎么样、实现了什么}
    - {id: issues_judgment, label: 问题与判断, question: 什么要重新判断、结论是什么}
    - {id: facts_traceability, label: 事实、证据与追溯, question: 依据什么、如何追溯}
  inventory_tabs: [Anchor, Reference, Business Artifact, Evidence & Runtime Record]
  cadence:
    - {id: low_frequency_versioned, label: 低频版本化}
    - {id: cross_period_stable, label: 跨周期稳定}
    - {id: period_formed, label: 周期形成}
    - {id: continuous, label: 持续更新}
    - {id: event_append, label: 事件追加}

objects:
  - id: Company
    doc_name: Company
    label: 公司是谁、为什么存在
    scope: company_strategy
    semantic: structure_responsibility
    inventory_tab: Reference          # 总表拆成 8 条 Reference，讨论稿 Q1 建议整合为一级对象
    cadence: low_frequency_versioned
    m1_scope: reference_only
    confirmed_by: [CEO]
    identity: {versioned: true, unit: 公司, current_pointer: true}
    content_dimensions: [使命, 愿景, 价值观与原则, 商业模式, 客户定义, 产品与服务定义, 组织角色与决策权定义, 必要的稳定政策与口径]
    boundary: [不等于 Strategy, 不把短期经营现实写进公司定义]
    carrier_default: 一个 Company 对象整合稳定公司 Context，各内容项可分别版本化
    runtime_0_4: {status: partial, object_type: CompanyReference, notes: 属于 tkos.contract-a 协议（A2），逐条陈述 title/statement/period/terms；公司本身是 gov_scopes 的 scope}
    runtime_0_5: {status: partial, object_type: CompanyReference, notes: 与 0.4 相同，稳定公司陈述走 A2 CompanyReference}
  - id: Strategy
    doc_name: Strategy
    label: 公司往哪走、靠什么赢
    scope: company_strategy
    semantic: intent_commitment
    inventory_tab: Anchor             # Root Anchor
    cadence: low_frequency_versioned
    m1_scope: this_period
    confirmed_by: [CEO]
    identity: {versioned: true, unit: 公司, current_pointer: true}
    content_dimensions: [战略方向, 战略选择, 取舍与不做什么, 价值实现逻辑, 战略路径, 所需能力, 关键假设, 适用范围与约束]
    boundary: [要有真实选择与取舍, 关键假设可验证, 单周期执行偏差不自动改 Strategy, 不内嵌 Architecture, 不放经营约束]
    carrier_default: 整体版本化；新版本生效后本周期 M1B.3 判断已确认承诺是否仍成立、只做最低必要调整，下一周期 M1B.1 按新版本重新审视 LTCO 与 PCO
    runtime_0_4: {status: exists, object_type: Strategy, fields: [statement, "required_capabilities[]", source_agreement_ref, source_proposal_ref], notes: 方向、选择、取舍等维度都在 statement 一段里，没有分字段}
    runtime_0_5: {status: exists, object_type: Strategy, fields: [statement, "required_capabilities[]", source_agreement_ref, source_proposal_ref], notes: 与 0.4 相同}
  - id: StrategicArchitecture
    doc_name: Strategic Architecture
    label: 用哪几块责任域去打
    scope: company_strategy
    semantic: structure_responsibility
    inventory_tab: Anchor
    cadence: low_frequency_versioned
    m1_scope: this_period
    confirmed_by: [CEO]
    identity: {versioned: true, unit: 公司, current_pointer: true}
    content_dimensions: [引用某一版 Strategy, 战场结构（定义、战略依据、边界与接口）, 域结构（定义、承接的所需能力、战略依据、边界与接口）]
    boundary: [只定义责任空间，不定义 LTCO / PCO, War Map 只是它的视图]
    carrier_default: 整体版本化；责任域是其中带稳定 unit_id 的定义项
    runtime_0_4: {status: exists, object_type: StrategicArchitecture, fields: ["battlefields[]", "domains[]", strategy_ref, source_agreement_ref, source_proposal_ref]}
    runtime_0_5: {status: exists, object_type: StrategicArchitecture, fields: ["battlefields[]", "domains[]", strategy_ref, source_agreement_ref, source_proposal_ref], notes: 与 0.4 相同}
  - id: BattlefieldDomain
