meeting_2026_09_22:
  minutes: obcn629472ww9266s9qy47l4
  participants: [斯一, 田田, 人豪]
  reviewed: 评审汇总第八节 v0.6
  decisions:
    - {t: "00:04", text: A1 四行七列与讨论稿 v0.3 一致；Mission Play、人 + Agent Plan、Mission Result 属 M2 / M3，本期只标位置}
    - {t: "00:06", text: Company 属性符合预期；总表页签（Anchor / Reference 等）田田已从她的分类里去掉，文档不再标}
    - {t: "00:07", text: Strategy 属性符合预期；对象自身的边界要单独一行，不与属性里的边界混}
    - {t: "00:10", text: Role Assignment 是跨层指派规则的记录（CEO 指派 DRI，DRI 指派 Owner，带生效与失效时间），不是方法定义的内容；谁有权指派谁未来另定}
    - {t: "00:11", text: Constraint 是田田 9/21 与溪南讨论后新加；每个层级的责任域都有自己的约束}
    - {t: "00:12", text: 只剩 Mission 最终确认人待 CEO 定，其余谁确认已共识}
    - {t: "00:14", text: Operating State 无人确认，Co-Agent 自驱生成}
    - {t: "00:15", text: PCO 缺 Expected LT Progress Advance，田田在文档上加评论补上；CEO Agent 要展示这个信息}
    - {t: "00:19", text: 总表 v0.8 已核对过，PCO 是特例，不再全量比对}
    - {t: "00:21", text: War Map 定位可能上调（田田 9/22 上午与明华讨论），内容可能变；Period、Dependency 等是本体运行所需，与方法无关}
    - {t: "00:23", text: LTCO 也有周期：从当下起滚动的未来 6 个月；PCO 1 个月}
    - {t: "00:24", text: 一个 PCO 下多个 Mission；Mission 贡献于其他责任域多见于战场与域之间}
    - {t: "00:25", text: Mission 一定有一个 Owner，端到端对交付结果负责，实际执行可分派；DRI 与 Owner 是两个角色，可以是同一个人}
    - {t: "00:26", text: PCO 也要参考本域当下的 Constraint；参考与承接不同}
    - {t: "00:28", text: Operating State 的时间属性改为起止时间，支持按任意时段取状态}
    - {t: "00:30", text: Period Review 直接读已确认的状态与结果，不从原始数据从零生成}
    - {t: "00:30", text: 「战略相关变化」按 Signal 写，现在分四类}
    - {t: "00:31", text: 「更新后进 M1B.3 判断承诺，不自动重开」没人看懂；田田口径是新版本进 M1B.1 影响后续 LTCO / PCO}
    - {t: "00:34", text: Traceability Record 是流程中产生的版本、确认记录、会议记录等的总称，不是 Evidence，保留}
    - {t: "00:35", text: 产品 L5 目前没有；CEO 稿重写，只放两张表（类 + 对象 + 属性；关系），讨论目的写最上面，无用信息先不放}
    - {t: "00:37", text: 结构图等与铭泽、溪南对清楚运行时后再给明华；后面要出 CEO Agent、DRI Agent 与本体的交互逻辑图}
    - {t: "00:36", text: 下一步：斯一对着已有接口做运行时适配并与溪南、铭泽对细节；田田在大表之上补模板与质量标准进 Agent 规则；可多轮迭代}
