    subjects: [Strategy, Company, Battlefield / Domain, LTCO, PCO, Mission]
    content_dimensions: [对象与时间范围（起止时间）, 当前现实, 相对意图的实现情况, 驱动与暴露, 含义]
    boundary: [不是红黄绿周报, 不替代正式对象, 可以分析但不替 Owner 定义 Management Issue, Play 与 Plan 不单列 State]
    carrier_default: 持续存在的 Current，能回到 Evidence，上层可下钻到下层 State，不是机械汇总
    runtime_0_4: {status: partial, object_type: OperatingState, fields: [subject_ref, as_of, summary, rag, "baseline_refs[]", "evidence_refs[]", "data_gaps[]", generation_version], notes: 走 method_propose_state 加 method_confirm_state 的人工确认，与“无人确认”相悖；有 rag 红黄绿字段；主体 × outcome × as_of 的唯一键在 gov_method_state_keys；只有 as_of 截止时间，没有起始时间，9/22 会议要求起止时间}
    runtime_0_5: {status: exists, object_type: OperatingState, fields: [subject_ref, as_of, period, summary, rag, "baseline_refs[]", "evidence_refs[]", "drilldown_refs[]", "data_gaps[]", generation_version], notes: 0.5 无人工确认，method_propose_state 直接成为 canonical；as_of 等于 period.end}
  - id: PeriodReview
    doc_name: Period Review
    label: 上个周期干得怎么样
    scope: company_strategy
    semantic: reality_results
    inventory_tab: Business Artifact
    cadence: period_formed
    m1_scope: this_period
    confirmed_by: [CEO，可改; Co-Agent 起草]
    identity: {versioned: true, unit: 公司 × 周期, current_pointer: true}
    content_dimensions: [本周期经营结果, 已确认的 Mission Result, 关键原因与新认知, 带入下期的 Management Issue 与现实, 对下一周期的含义]
    boundary: [直接读已确认的 Operating State 与 Mission Result，不从原始数据重算, 不生成下一周期 PCO, 未完成事项不自动顺延, 责任域一级的复盘总表未定义，等 M2 workshop]
    carrier_default: 直接读各责任域 Operating State 与 Mission Result；分域小节按 unit_id；确认留 Confirmation Record；CEO 确认后才起草 PCO
    runtime_0_4: {status: partial, object_type: PeriodReview, fields: [review_id, period, "target_refs[]", "state_refs[]", "fact_refs[]", "findings[]", "learnings[]", "implications[]", generation_version], notes: 只有 m1b_generate_review / m1b_regenerate_review，没有 CEO 确认动作}
    runtime_0_5: {status: exists, object_type: PeriodReview, fields: [review_id, period, "target_refs[]", "state_refs[]", "fact_refs[]", "findings[]", "learnings[]", "implications[]", generation_version], notes: 新增 CEO 确认动作 m1b_confirm_review，可改 findings / learnings / implications}
  - id: MissionResult
    doc_name: Mission Result
    label: Mission 的完成主张
    scope: mission
    semantic: reality_results
    inventory_tab: Business Artifact
    cadence: event_append
    m1_scope: later
    method: M3.2.3
    confirmed_by: [DRI 复核]
    identity: {versioned: false, unit: 一次完成主张}
    content_dimensions: [Mission 引用, 实际结果对预期结果, 验收证据, 重大未解决事项与残余风险, 完成主张与提交时间]
    boundary: [围绕预期结果而非 Task 完成率, Owner 不能自行关闭 Mission]
    carrier_default: 事件形成；复核通过才改变 Mission 生命周期；Period Review 直接消费
    runtime_0_4: {status: missing}
    runtime_0_5: {status: missing, notes: M3}
  - id: StrategicIssue
    doc_name: Strategic Issue
    label: 要重判战略的核心问题
    scope: company_strategy
    semantic: issues_judgment
    inventory_tab: Anchor
    cadence: event_append
    m1_scope: later
    method: M1-A
    confirmed_by: [CEO]
    identity: {versioned: true, unit: 一个核心战略问题, current_pointer: true}
    content_dimensions: [核心战略问题, 触发与来源, 为何是现在, 最低充分的 Context, 边界]
    boundary: [一个 Issue 一个核心问题, 有效战略存续时只在 M1A.3 判断重开后形成]
    carrier_default: 独立业务对象
    runtime_0_4: {status: partial, object_type: StrategicIssue, fields: [summary, core_question, business_scope, urgency, urgency_reason, "source_refs[]", strategy_ref, architecture_ref, reframe_of_ref], notes: 运行时可随时 m1a_create_issue，没有"只在 M1A.3 重开后形成"的门}
    runtime_0_5: {status: partial, object_type: StrategicIssue, notes: 与 0.4 相同，M1-A 本期不展开}
  - id: Agreement
    doc_name: Agreement
    label: 战略研判后的共同结论
    scope: company_strategy
    semantic: issues_judgment
    inventory_tab: Business Artifact
    cadence: event_append
    m1_scope: later
    method: M1-A
    confirmed_by: [相关责任人]
    identity: {versioned: false, unit: 一次正式结论, immutable: true}
    content_dimensions: [关联的 Strategic Issue 与对象, 共识内容, 依据与关键证据, 参与人与角色, 生效时间, 受影响的正式信息]
    boundary: [不能用会议记录代替, 不必然导致 Strategy 或 Architecture 更新]
    carrier_default: 不可变的决定记录
    runtime_0_4: {status: exists, object_type: StrategicAgreement, fields: [issue_ref, statement, "participants[]", "evidence_refs[]", no_change], notes: 确认动作 m1a_confirm_agreement}
    runtime_0_5: {status: exists, object_type: StrategicAgreement, notes: 与 0.4 相同}
  - id: Finding
    doc_name: Finding
    label: 状态里需要责任人重新判断的事
    scope: cross_cutting
    semantic: issues_judgment
    inventory_tab: Business Artifact
    cadence: event_append
    m1_scope: later
    method: MF
    confirmed_by: []                  # MF 形成；责任人判断后 MF 退出
    identity: {versioned: false, unit: 一条反馈, targets: 一个责任对象和一个主决策人}
    content_dimensions: [发现陈述, 证据依据, 影响与不确定性, 需要判断什么, 关联的 State 与证据及时间]
    boundary: [Finding 不等于 Management Issue, “实质影响”与“需要责任人判断”两个门同时成立才形成]
    carrier_default: 反馈产物加目标对象与主决策人
    runtime_0_4: {status: missing, notes: 最接近的是 OperatingProblem，但它带处置与责任人，更像 Management Issue}
    runtime_0_5: {status: missing, notes: MF}
  - id: ManagementIssue
    doc_name: Management Issue
    label: 责任人确认要处理的经营问题
    scope: cross_cutting
    semantic: issues_judgment
    inventory_tab: Anchor             # Runtime Anchor
    cadence: event_append
    m1_scope: later
    method: M1B.3 / M2.3 / M3.3
    confirmed_by: [CEO, DRI, Owner]
    identity: {versioned: true, unit: 一个正式问题, current_pointer: true}
    dispositions: [保持, 观察, 临时缓解, 返回, 路由, 升级, 关闭]
    content_dimensions: [问题陈述, 核心判断问题, 为何重要, 影响对象, Finding 与 State 引用, 当前责任人与决定权, 当前路由, 最晚判断时点, 来源与重述历史, 处置]
    boundary: [不能机械继承 Finding 或上游的 framing, 跨方法路由后接收人仍要重新判断, M3 的问题先到 M2.3 再到 M1B.3]
    carrier_default: 统一问题对象加责任对象、Owner 与来源线索
    runtime_0_4: {status: partial, object_type: OperatingProblem, fields: [state_ref, core_question, statement, why_material, level, responsible_assignment_id, "evidence_refs[]", decision_deadline], notes: 动作 method_open_problem / method_revise_problem / method_close_problem；处置枚举与 M1-B 不同}
    runtime_0_5: {status: partial, object_type: OperatingProblem, notes: 与 0.4 相同，M1B.3 本期不做}
  - id: Evidence
    doc_name: Evidence
    label: 流水与事实
    scope: cross_cutting
    semantic: facts_traceability
    inventory_tab: Evidence & Runtime Record
    cadence: event_append
    m1_scope: reference_only
    confirmed_by: []
    identity: {versioned: false, unit: 一条事实, immutable: true}
    subtypes: [实际结果, 业务事实, 客户与使用事实, 外部信号, 执行证据, 实验结果, 风险 / 依赖 / 约束事实]
    content_dimensions: [来源, 时间, 事实或结果, 关联对象, 可靠性, 子类]
    boundary: [事实、推断、解释分开, Evidence 本身不是 Finding、Result 或判断]
    carrier_default: 一个一级对象、子类是字段
    runtime_0_4: {status: partial, object_type: EvidenceAsset, also: BusinessFact, notes: EvidenceAsset 存原始字节的哈希与 S3 版本，BusinessFact 有 subject_ref / source_ref / corrects_ref；没有子类字段}
    runtime_0_5: {status: partial, object_type: EvidenceAsset, notes: 与 0.4 相同，没有子类字段}
  - id: TraceabilityRecord
    doc_name: Traceability Record
    label: 对象怎么变、判断怎么形成、责任怎么交接
    scope: cross_cutting
    semantic: facts_traceability
    inventory_tab: Evidence & Runtime Record
    cadence: event_append
    m1_scope: this_period             # 版本历史、Confirmation Record、来源追溯本期用
    confirmed_by: [Confirmation Record 由人做出、系统记录]
    identity: {versioned: false, unit: 一条记录, immutable: true}
    subtypes:
      - {id: VersionHistory, label: 版本历史, m1_scope: this_period, runtime: gov_object_revisions}
      - {id: ConfirmationRecord, label: Confirmation Record, m1_scope: this_period, dimensions: [执行人, 时间, 绑定的材料确切版本, 决定与结果（维持、确认、成立、不成立、待调整）, 指派人, 说明], runtime: gov_method_reviews 的决定类记录、gov_method_commitments、gov_activation_records、gov_lifecycle_events}
      - {id: HandoffRouting, label: 交接与路由, m1_scope: later, runtime: 部分（m1a_transfer_problem）}
      - {id: Provenance, label: 来源追溯, m1_scope: this_period, runtime: 钉版本的 ExactRef 引用与 gov_action_receipts}
      - {id: MeetingRecord, label: 会议记录, m1_scope: later, runtime: workspace v02 来源；0.2 另有 MeetingRound / MeetingMinutes 对象类型}
      - {id: StepExecution, label: StepExecution, m1_scope: optional, runtime: gov_method_run_attempts（method_record_attempt）}
      - {id: Notification, label: 通知记录, m1_scope: later, runtime: 总表标 To Define；运行时有任务 outbox 与外部派发，未作为记录对象}
      - {id: ReopenTrigger, label: 重开条件记录, m1_scope: later, runtime: 缺；总表列为 Runtime Record / Rule}
    boundary: [不是 Evidence，不是原始数据, 不替代 Strategy、Agreement、Management Issue 等业务对象, 只记录它们的形成、变化、确认和来源]
    carrier_default: 业务上一个总称；技术上对应不同机制，不是一张表
    runtime_0_4: {status: partial, notes: 见 subtypes 的 runtime 字段}
    runtime_0_5: {status: partial, notes: "新增确认记录投影 GET /v1/method/objects/{id}/confirmations 与 review_records 的 effect 分类；交接、会议记录、通知、重开条件随 M2 / M3 / MF"}

relations:
  # family: responsibility 责任 | causal_support 因果支撑 | state_issue 状态与问题 | issue_loop 议题环 | evidence_trace 证据与追溯
