[project]
name = "tkos-memory-service"
version = "0.3.0"
description = "Standalone governed Memory Service for TKOS clients"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
s3 = ["botocore>=1.34"]

[project.scripts]
tkos-memory-migrate = "memory_service_app.migrate:main"
tkos-memory-worker = "memory_service_runtime.cli:worker_main"
tkos-memory-worker-health = "memory_service_runtime.cli:health_main"
tkos-memory-task-enqueue = "memory_service_runtime.cli:enqueue_main"
tkos-governed-control = "memory_service_runtime.governed.control:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
timeout = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/memory_service",
    "src/memory_service_app",
    "src/memory_service_runtime",
    "src/adapter",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# The dashboard source and the compiled assets under
# src/memory_service_app/dashboard_dist are packaged so a wheel can be built
# from the sdist without a Node toolchain.  scripts/build_dashboard.sh rebuilds
# and verifies the assets before Python packaging.
include = ["src", "tests", "workbench", "docs", "contracts", "scripts", "acceptance",
           "pyproject.toml", "README.md", "requirements.lock", "hatch_build.py"]
