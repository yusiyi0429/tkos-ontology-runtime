name: tkos-ontology-runtime-acceptance

# This project never references target-local containers, networks, volumes or credentials.
services:
  postgres:
    image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
    environment:
      POSTGRES_USER: tkos_acceptance_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?generated by infra.py}
      POSTGRES_DB: tkos_runtime_acceptance
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:?generated by infra.py}"
        host_ip: 127.0.0.1
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tkos_acceptance_admin -d tkos_runtime_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    networks: [acceptance]

  minio:
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?generated by infra.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?generated by infra.py}
    ports:
      - target: 9000
        published: "${MINIO_PORT:?generated by infra.py}"
        host_ip: 127.0.0.1
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/ready]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    networks: [acceptance]

  minio-init:
    image: minio/mc@sha256:ba8af71554963bb6ad5c4301ff3d82176e96f0b0c7595047da989cacfae83682
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set acceptance http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc ready acceptance >/dev/null
        mc mb --ignore-existing acceptance/runtime-acceptance-artifacts >/dev/null
        mc version enable acceptance/runtime-acceptance-artifacts >/dev/null
        mc mb --ignore-existing --with-lock acceptance/runtime-acceptance-snapshots >/dev/null
        mc version enable acceptance/runtime-acceptance-snapshots >/dev/null
        mc retention set --default GOVERNANCE 1d acceptance/runtime-acceptance-snapshots >/dev/null
        cat >/tmp/app-policy.json <<'POLICY'
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketVersions","s3:GetBucketVersioning","s3:GetBucketObjectLockConfiguration"],"Resource":["arn:aws:s3:::runtime-acceptance-artifacts","arn:aws:s3:::runtime-acceptance-snapshots"]},
          {"Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion","s3:GetObjectRetention","s3:PutObject"],"Resource":["arn:aws:s3:::runtime-acceptance-artifacts/*","arn:aws:s3:::runtime-acceptance-snapshots/*"]},
          {"Effect":"Allow","Action":["s3:DeleteObject"],"Resource":["arn:aws:s3:::runtime-acceptance-artifacts/*"]}
        ]}
        POLICY
        mc admin user add acceptance "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" >/dev/null
        mc admin policy create acceptance runtime-acceptance-app /tmp/app-policy.json >/dev/null
        mc admin policy attach acceptance runtime-acceptance-app --user "$$MINIO_APP_ACCESS_KEY" >/dev/null
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [acceptance]

networks:
  acceptance: {}

volumes:
  postgres-data:
  minio-data:
