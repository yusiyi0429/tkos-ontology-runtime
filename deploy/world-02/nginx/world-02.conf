# world-02：tkos.world/0.2 实验实例。整个域名交给运行时，不按路径拆。
# 证书与 memory-api.conf 同法：certbot webroot（/var/www/certbot），SSL 参数用 certbot 的公共片段。
server {
    listen 80;
    server_name world-02.tokenkingos.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name world-02.tokenkingos.com;
    ssl_certificate     /etc/letsencrypt/live/world-02.tokenkingos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/world-02.tokenkingos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
